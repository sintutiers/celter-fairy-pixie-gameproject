name: "create release"
on:
  workflow_run:
    workflows: ["godot-ci export"]
    types:
      - completed
permissions:
  contents: read
# plain POSIX sh, no bash/dash extras/non POSIX flags, same as .githooks/pre-commit
defaults:
  run:
    shell: sh
concurrency:
  group: create-release
  cancel-in-progress: false
jobs:
  create:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Compute next version
        run: |
          git fetch --tags --depth=1
          LATEST="$(git tag --list "0.0.*" --sort=-v:refname | head -n 1)"
          if [ -z "$LATEST" ]; then
            PATCH=1
          else
            # ${LATEST##*.} = patch number after last dot
            PATCH=$((${LATEST##*.} + 1))
          fi
          printf 'TAG=0.0.%s\n' "$PATCH" >> "$GITHUB_ENV"
      - name: Create prerelease
        run: gh release create "$TAG" --title "$TAG" --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

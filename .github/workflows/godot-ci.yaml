name: "godot-ci export"
on:
  push:
    branches: [master]
permissions:
  contents: read

# NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` below to ".".
# NOTE: android export code taken and modified from `Simon Dalvai @dulvui`
concurrency:
  group: godot-ci-export-${{ github.ref }}
  cancel-in-progress: true
# plain POSIX sh, no bash/dash extras/non POSIX flags, same as .githooks/pre-commit
defaults:
  run:
    shell: sh
env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: metroidvania jam cool dean version
  PROJECT_PATH: .

jobs:
  # every export needs this ∴ failed test stops broken build + web deploy
  test:
    name: GUT Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Import
        # fresh checkout has no class_name cache, GutTest + tests need it
        run: |
          cd "$PROJECT_PATH"
          godot --headless --import
      - name: Run Tests
        # exits 1 on failed test, dirs + settings come from .gutconfig.json
        run: |
          cd "$PROJECT_PATH"
          godot --headless -s addons/gut/gut_cmdln.gd -gexit -- --offline

  # not needed by exports, style issue shouldnt block build
  lint:
    name: GDScript Lint
    runs-on: ubuntu-latest
    env:
      # same as editor plugin ∴ CI + editor agree on rules
      FORMATTER_VERSION: 0.28.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install gdscript-formatter
        run: |
          curl -sSL -o "$RUNNER_TEMP/formatter.zip" "https://github.com/GDQuest/GDScript-formatter/releases/download/${FORMATTER_VERSION}/gdscript-formatter-${FORMATTER_VERSION}-linux-x86_64.zip"
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/formatter.zip"
          chmod +x "$RUNNER_TEMP/gdscript-formatter-${FORMATTER_VERSION}-linux-x86_64"
      - name: Lint
        # same script as pre-commit hook ∴ one list of rules + excludes
        run: GDSCRIPT_FORMATTER="$RUNNER_TEMP/gdscript-formatter-${FORMATTER_VERSION}-linux-x86_64" .githooks/pre-commit

  export-windows:
    name: Windows Export
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Windows Build
        run: |
          mkdir -p build/windows
          EXPORT_DIR="$(cd build && pwd -P)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/$EXPORT_NAME.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/windows

  export-linux:
    name: Linux Export
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Linux Build
        run: |
          mkdir -p build/linux
          EXPORT_DIR="$(cd build && pwd -P)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "Linux/X11" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/linux

  export-web:
    name: Web Export
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Web Build
        run: |
          mkdir -p build/web
          EXPORT_DIR="$(cd build && pwd -P)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  export-mac:
    name: Mac Export
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Mac Build
        run: |
          mkdir -p build/mac
          EXPORT_DIR="$(cd build && pwd -P)"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-release "macOS" "$EXPORT_DIR/mac/$EXPORT_NAME.zip"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: build/mac


